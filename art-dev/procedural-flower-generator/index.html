<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Flower Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Procedural Flower Generator</h1>
        <div class="controls">
            <button class="btn" id="generateBtn">Generate New Flower</button>
            <button class="btn" id="generateMultipleBtn">Generate Multiple</button>
            <button class="btn" id="clearBtn">Clear Canvas</button>
        </div>
        <div class="info">
            <p>Click anywhere on canvas to place a flower</p>
        </div>
    </div>
    <script src="flower-generator.js"></script>
</body>
</html>
